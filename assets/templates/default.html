<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="googlebot" content="noindex" />
    <title>$title$</title>
    <link rel="icon" href="$asset-base$/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="preload" href="$asset-base$/fonts/Merriweather-Variable.woff2" as="font" type="font/woff2" crossorigin />
    $stylesheets$
    $math-assets$
    $line-breaking-assets$
    $page-runtime-assets$
</head>

<body class="click-open-notes">
    <nav class="top-controls no-print" aria-label="Page controls">
        <button class="nav-button" type="button" id="toggle-left-margin" data-body-class="hide-left-margin" aria-controls="contents-big" aria-pressed="true">Contents</button>
        <button class="nav-button" type="button" id="toggle-sidenotes" data-body-class="click-open-notes" aria-pressed="false">Sidenotes</button>
    </nav>
    <script>
        (function () {
            try {
                var saved = window.localStorage.getItem(
                    "pandocmd:control-state:" + window.location.pathname
                );
                if (saved === null) {
                    return;
                }
                saved = JSON.parse(saved);
                document.querySelectorAll("[data-body-class]").forEach(function (control) {
                    var name = control.getAttribute("data-body-class");
                    document.body.classList.toggle(name, saved.indexOf(name) !== -1);
                });
            } catch (error) {
                return;
            }
        }());
    </script>
    <div class="page-layout">
        <div class="toc">
            <div id="contents-big">
                <a class="mini-header" href="#">Contents</a>
                $toc$
            </div>
        </div>
        <main class="text-space">
            $if(title)$
            <header class="page-header">
                <h1 class="pagetitle">$title$</h1>
            </header>
            $endif$
            <article>
                <section class="body">
                    $if(abstract)$
                    <div class="abstract">
                        <div class="abstract-title">$abstract-title$</div>
                        $abstract$
                    </div>
                    $endif$
                    $body$
                </section>
            </article>
            <footer></footer>
        </main>
    </div>
</body>

</html>
