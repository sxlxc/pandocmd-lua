<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="googlebot" content="noindex" />
    <title>$title$</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="preload" href="/fonts/Merriweather-Variable.woff2" as="font" type="font/woff2" crossorigin />
    $stylesheets$
    <link rel="stylesheet" href="/katex/katex.min.css" />
    <script defer src="/katex/katex.min.js"></script>
</head>

<body class="click-open-notes">
    <nav class="top-controls no-print" aria-label="Page controls">
        <button class="nav-button" type="button" id="toggle-left-margin" aria-controls="contents-big" aria-pressed="true">Contents</button>
        <button class="nav-button" type="button" id="toggle-sidenotes" aria-pressed="false">Sidenotes</button>
    </nav>
    <script>
        (function () {
            var toggles = [
                ["toggle-left-margin", "hide-left-margin"],
                ["toggle-sidenotes", "click-open-notes"]
            ];
            var storageKey = "pandocmd:control-state:" + window.location.pathname;
            var activeClasses = readControlState();

            toggles.forEach(function (toggle) {
                var button = document.getElementById(toggle[0]);
                var className = toggle[1];

                document.body.classList.toggle(className, Boolean(activeClasses[className]));

                if (!button) {
                    return;
                }

                function sync() {
                    button.setAttribute("aria-pressed", String(!document.body.classList.contains(className)));
                }

                button.addEventListener("click", function () {
                    document.body.classList.toggle(className);
                    writeControlState();
                    sync();
                });

                sync();
            });

            function readControlState() {
                var state = Object.create(null);
                var stored;

                try {
                    stored = window.localStorage.getItem(storageKey);
                    if (stored === null) {
                        state["click-open-notes"] = true;
                        return state;
                    }

                    JSON.parse(stored).forEach(function (className) {
                        state[className] = true;
                    });
                } catch (error) {
                    state = Object.create(null);
                    state["click-open-notes"] = true;
                }

                return state;
            }

            function writeControlState() {
                var classes = toggles
                    .map(function (toggle) {
                        return toggle[1];
                    })
                    .filter(function (className) {
                        return document.body.classList.contains(className);
                    });

                try {
                    window.localStorage.setItem(storageKey, JSON.stringify(classes));
                } catch (error) {
                    return;
                }
            }

        }());
    </script>
    <div class="page-layout">
        <div class="toc">
            <div id="contents-big">
                <a href="#">
                    <p class="mini-header">Contents</p>
                </a>
                $toc$
            </div>
        </div>
        <div class="text-space">
            $if(title)$
            <header class="page-header">
                <h1 class="pagetitle">$title$</h1>
            </header>
            $endif$
            <main role="main">
                <article>
                    <section class="body">
                        $if(abstract)$
                        <div class="abstract">
                            <div class="abstract-title">$abstract-title$</div>
                            $abstract$
                        </div>
                        $endif$
                        $body$
                    </section>
                </article>
            </main>
            <footer></footer>
        </div>
    </div>
    <script>
        window.__pandocmd = window.__pandocmd || {};

        function initKatex() {
            renderKatexMath();

            return function () {};

            function renderKatexMath() {
                var mathNodes;

                if (!window.katex) {
                    return;
                }

                mathNodes = Array.prototype.slice.call(
                    document.querySelectorAll(".math.inline, .math.display")
                );
                mathNodes.forEach(function (mathNode) {
                    var tex = mathNode.textContent;
                    var displayMode = mathNode.classList.contains("display");

                    if (!tex || mathNode.hasAttribute("data-pandocmd-katex-source")) {
                        return;
                    }

                    try {
                        window.katex.render(tex, mathNode, {
                            displayMode: displayMode,
                            throwOnError: false
                        });
                    } catch (error) {
                        return;
                    }

                    mathNode.setAttribute("data-pandocmd-katex-source", tex);
                });
            }
        }

        function initFolding() {
            var body = document.querySelector(".text-space section.body");

            if (!body) {
                return function () {};
            }

            var headings = Array.prototype.slice.call(
                body.querySelectorAll("h1, h2, h3, h4, h5, h6")
            );
            var storageKey = "pandocmd:folded-sections:" + window.location.pathname;
            var folded = readFoldedSections();
            var foldableSections = [];
            var foldableNodes = [];
            var tocLinks = Array.prototype.slice.call(
                document.querySelectorAll("#contents a[href^=\"#\"], #contents-big a[href^=\"#\"]")
            );

            headings.forEach(function (heading, index) {
                var nodes = sectionNodes(heading);
                var id = ensureHeadingId(heading, index);
                var button = document.createElement("button");
                var icon = document.createElement("span");
                var section = {
                    id: id,
                    heading: heading,
                    button: button,
                    nodes: nodes,
                    title: compactText(heading.textContent)
                };

                heading.classList.add("section-heading-foldable");
                button.type = "button";
                button.className = "section-fold-button no-print";

                icon.className = "section-fold-icon";
                icon.setAttribute("aria-hidden", "true");
                icon.textContent = ">";
                button.appendChild(icon);

                button.addEventListener("click", function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    folded[id] = !folded[id];
                    syncFoldState(true);
                });

                heading.insertBefore(button, heading.firstChild);
                foldableSections.push(section);
                nodes.forEach(function (node) {
                    if (foldableNodes.indexOf(node) === -1) {
                        foldableNodes.push(node);
                    }
                });
            });

            tocLinks.forEach(function (link) {
                link.addEventListener("click", function () {
                    var target = headingForLink(link);

                    if (target) {
                        revealHeading(target);
                    }
                });
            });

            syncFoldState(false);

            function readFoldedSections() {
                var state = Object.create(null);

                try {
                    JSON.parse(window.localStorage.getItem(storageKey) || "[]").forEach(function (id) {
                        state[id] = true;
                    });
                } catch (error) {
                    return Object.create(null);
                }

                return state;
            }

            function writeFoldedSections() {
                var ids = foldableSections
                    .map(function (section) {
                        return section.id;
                    })
                    .filter(function (id) {
                        return folded[id];
                    });

                try {
                    if (ids.length) {
                        window.localStorage.setItem(storageKey, JSON.stringify(ids));
                    } else {
                        window.localStorage.removeItem(storageKey);
                    }
                } catch (error) {
                    return;
                }
            }

            function ensureHeadingId(heading, index) {
                if (heading.id) {
                    return heading.id;
                }

                var base = compactText(heading.textContent)
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, "-");
                var candidate;
                var id;
                var suffix = 2;

                while (base.charAt(0) === "-") {
                    base = base.slice(1);
                }

                while (base.charAt(base.length - 1) === "-") {
                    base = base.slice(0, -1);
                }

                candidate = "pandocmd-section-" + (base || "heading") + "-" + (index + 1);
                id = candidate;

                while (document.getElementById(id)) {
                    id = candidate + "-" + suffix;
                    suffix += 1;
                }

                heading.id = id;
                return id;
            }

            function compactText(text) {
                return (text || "").replace(/\s+/g, " ").trim();
            }

            function sectionNodes(heading) {
                var level = headingLevel(heading);
                var nodes = [];
                var node = heading.nextElementSibling;

                while (node) {
                    if (isHeading(node) && headingLevel(node) <= level) {
                        break;
                    }

                    nodes.push(node);
                    node = node.nextElementSibling;
                }

                return nodes;
            }

            function isHeading(node) {
                return (
                    node.tagName.length === 2 &&
                    node.tagName.charAt(0) === "H" &&
                    node.tagName.charAt(1) >= "1" &&
                    node.tagName.charAt(1) <= "6"
                );
            }

            function headingLevel(heading) {
                return Number(heading.tagName.slice(1));
            }

            function syncFoldState(persist) {
                var hiddenNodes = [];

                foldableSections.forEach(function (section) {
                    var isFolded = Boolean(folded[section.id]);

                    section.heading.classList.toggle("section-heading-folded", isFolded);
                    section.button.setAttribute("aria-expanded", String(!isFolded));
                    section.button.setAttribute("aria-label", (isFolded ? "Unfold" : "Fold") + labelSuffix(section.title));
                    section.button.setAttribute("title", isFolded ? "Unfold section" : "Fold section");

                    if (isFolded) {
                        section.nodes.forEach(function (node) {
                            if (hiddenNodes.indexOf(node) === -1) {
                                hiddenNodes.push(node);
                            }
                        });
                    }
                });

                foldableNodes.forEach(function (node) {
                    var isHidden = hiddenNodes.indexOf(node) !== -1;

                    node.classList.toggle("section-fold-hidden", isHidden);

                    if (isHidden) {
                        node.setAttribute("aria-hidden", "true");
                    } else {
                        node.removeAttribute("aria-hidden");
                    }
                });

                syncToc();

                if (persist) {
                    writeFoldedSections();
                }
            }

            function labelSuffix(title) {
                return title ? " section " + title : " section";
            }

            function syncToc() {
                tocLinks.forEach(function (link) {
                    var target = headingForLink(link);
                    var isFolded = Boolean(target && folded[target.id]);
                    var isInsideFoldedSection = Boolean(
                        target &&
                        !isFolded &&
                        target.classList.contains("section-fold-hidden")
                    );

                    link.classList.toggle("section-toc-folded", isFolded);
                    link.classList.toggle("section-toc-in-folded-section", isInsideFoldedSection);
                });
            }

            function headingForLink(link) {
                var id = link.hash ? link.hash.slice(1) : "";

                if (!id) {
                    return null;
                }

                try {
                    id = decodeURIComponent(id);
                } catch (error) {
                    return null;
                }

                var target = document.getElementById(id);

                return target && isHeading(target) ? target : null;
            }

            function revealHeading(heading) {
                var changed = false;

                foldableSections.forEach(function (section) {
                    if (folded[section.id] && section.nodes.indexOf(heading) !== -1) {
                        folded[section.id] = false;
                        changed = true;
                    }
                });

                if (changed) {
                    syncFoldState(true);
                }
            }

            return function () {};
        }

        function initXref() {
            var body = document.querySelector(".text-space section.body");
            var targetSelector = [
                ".theorem-environment[id]",
                ".equation[id]",
                ".csl-entry[id]",
                "figure[id]",
                "table[id]",
                "div[id]:not(.source-line):not(.references):not(.csl-bib-body)"
            ].join(", ");
            var preview = null;
            var activeLink = null;
            var hideTimer = null;

            if (!body) {
                return function () {};
            }

            Array.prototype.slice.call(body.querySelectorAll("a[href^=\"#\"]")).forEach(function (link) {
                link.addEventListener("pointerenter", function () {
                    show(link);
                });
                link.addEventListener("pointerleave", scheduleHide);
                link.addEventListener("focusin", function () {
                    show(link);
                });
                link.addEventListener("focusout", scheduleHide);
            });

            function ensurePreview() {
                if (preview) {
                    return preview;
                }

                preview = document.createElement("div");
                preview.id = "xref-preview";
                preview.className = "xref-preview no-print";
                preview.setAttribute("role", "tooltip");
                preview.hidden = true;
                preview.addEventListener("pointerenter", cancelHide);
                preview.addEventListener("pointerleave", scheduleHide);
                preview.addEventListener("focusin", cancelHide);
                preview.addEventListener("focusout", scheduleHide);
                (body.closest(".text-space") || document.body).appendChild(preview);

                return preview;
            }

            function show(link) {
                var target = previewTarget(link);
                var box;
                var clone;

                if (!target) {
                    return;
                }

                cancelHide();
                box = ensurePreview();
                clone = target.cloneNode(true);
                scrubClone(clone);

                if (activeLink && activeLink !== link) {
                    activeLink.removeAttribute("aria-describedby");
                }

                activeLink = link;
                link.setAttribute("aria-describedby", box.id);
                box.innerHTML = "";
                box.appendChild(clone);
                box.hidden = false;
                box.style.visibility = "hidden";
                positionPreview(link);
                box.style.visibility = "";

                window.addEventListener("scroll", syncPosition, true);
                window.addEventListener("resize", syncPosition);
                document.addEventListener("keydown", handleKeydown);
            }

            function hide() {
                cancelHide();

                if (activeLink) {
                    activeLink.removeAttribute("aria-describedby");
                }

                activeLink = null;

                if (preview) {
                    preview.hidden = true;
                    preview.innerHTML = "";
                }

                window.removeEventListener("scroll", syncPosition, true);
                window.removeEventListener("resize", syncPosition);
                document.removeEventListener("keydown", handleKeydown);
            }

            function scheduleHide() {
                cancelHide();
                hideTimer = window.setTimeout(function () {
                    if (isPointerOrFocusInside()) {
                        return;
                    }

                    hide();
                }, 80);
            }

            function cancelHide() {
                if (hideTimer) {
                    window.clearTimeout(hideTimer);
                    hideTimer = null;
                }
            }

            function previewTarget(link) {
                var id;
                var target;

                if (
                    link.classList.contains("source-line-link") ||
                    link.closest(".toc, #contents, #contents-big, .top-controls, .xref-preview")
                ) {
                    return null;
                }

                id = hashId(link);
                if (!id) {
                    return null;
                }

                target = document.getElementById(id);
                if (!target || !body.contains(target) || !target.matches(targetSelector)) {
                    return null;
                }

                return target;
            }

            function hashId(link) {
                var hash = link.hash || "";

                if (hash === "" || hash === "#") {
                    return "";
                }

                try {
                    return decodeURIComponent(hash.slice(1));
                } catch (error) {
                    return "";
                }
            }

            function scrubClone(node) {
                Array.prototype.slice.call(node.querySelectorAll(".source-line-link")).forEach(function (child) {
                    child.parentNode.removeChild(child);
                });

                Array.prototype.slice.call(node.querySelectorAll(".section-fold-button")).forEach(function (child) {
                    child.parentNode.removeChild(child);
                });

                [node].concat(Array.prototype.slice.call(node.querySelectorAll(".section-fold-hidden"))).forEach(function (child) {
                    if (child.classList.contains("section-fold-hidden")) {
                        child.classList.remove("section-fold-hidden");
                        child.removeAttribute("aria-hidden");
                    }
                });

                [node].concat(Array.prototype.slice.call(node.querySelectorAll(".section-heading-foldable, .section-heading-folded"))).forEach(function (child) {
                    child.classList.remove("section-heading-foldable");
                    child.classList.remove("section-heading-folded");
                });

                Array.prototype.slice.call(node.querySelectorAll("[id], [for]")).forEach(function (child) {
                    child.removeAttribute("id");
                    child.removeAttribute("for");
                });

                node.removeAttribute("id");
                node.removeAttribute("for");
            }

            function positionPreview(link) {
                var gap = 10;
                var margin = 12;
                var rect;
                var left;
                var top;

                if (!preview || preview.hidden) {
                    return;
                }

                rect = link.getBoundingClientRect();
                left = rect.left + (rect.width / 2) - (preview.offsetWidth / 2);
                left = Math.max(margin, Math.min(left, window.innerWidth - preview.offsetWidth - margin));
                top = rect.bottom + gap;

                if (top + preview.offsetHeight > window.innerHeight - margin) {
                    top = rect.top - preview.offsetHeight - gap;
                }

                top = Math.max(margin, Math.min(top, window.innerHeight - preview.offsetHeight - margin));

                preview.style.left = Math.round(left) + "px";
                preview.style.top = Math.round(top) + "px";
            }

            function syncPosition() {
                if (!activeLink || !previewTarget(activeLink)) {
                    hide();
                    return;
                }

                positionPreview(activeLink);
            }

            function handleKeydown(event) {
                if (event.key === "Escape") {
                    hide();
                }
            }

            function isPointerOrFocusInside() {
                var focused = document.activeElement;

                return Boolean(
                    activeLink && activeLink.matches(":hover, :focus") ||
                    preview && (
                        preview.matches(":hover") ||
                        preview.contains(focused)
                    )
                );
            }

            return function teardown() {
                hide();

                if (preview && preview.parentNode) {
                    preview.parentNode.removeChild(preview);
                }
            };
        }

        function enhance() {
            var teardowns = window.__pandocmd.teardowns || [];

            while (teardowns.length) {
                var teardown = teardowns.pop();

                try {
                    teardown();
                } catch (error) {
                    /* ignore teardown failures */
                }
            }

            teardowns.push(initKatex());
            teardowns.push(initFolding());
            teardowns.push(initXref());
            window.__pandocmd.teardowns = teardowns;
        }

        // Live reload swaps only the article/toc content in place instead of a
        // full navigation, so the <head> (fonts, KaTeX runtime, stylesheets)
        // stays loaded and the page does not flash or reflow. Scroll position is
        // preserved and the content enhancers are re-run on the new markup.
        function softReload() {
            var scrollLeft = window.scrollX;
            var scrollTop = window.scrollY;

            fetch(window.location.href, { cache: "no-store" })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("live reload fetch failed: " + response.status);
                    }

                    return response.text();
                })
                .then(function (html) {
                    var parsed = new DOMParser().parseFromString(html, "text/html");
                    var next = parsed.querySelector(".page-layout");
                    var current = document.querySelector(".page-layout");

                    if (!next || !current) {
                        throw new Error("live reload could not find .page-layout");
                    }

                    document.title = parsed.title;
                    current.innerHTML = next.innerHTML;
                    enhance();
                    window.scrollTo({ left: scrollLeft, top: scrollTop, behavior: "instant" });
                })
                .catch(function () {
                    window.location.reload();
                });
        }

        window.__pandocmd.enhance = enhance;
        window.__pandocmd.softReload = softReload;

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", enhance);
        } else {
            enhance();
        }
    </script>
$live-reload$
</body>

</html>
