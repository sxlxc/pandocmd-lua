# pandocmd live preview — served by the local nginx on port 80.
#
# Install: copy to the nginx `servers/` include dir and reload, e.g.
#   ln -sfn /path/to/pandocmd-lua/assets /opt/homebrew/var/www/pandocmd
#   cp nginx/pandocmd.conf /opt/homebrew/etc/nginx/servers/pandocmd.conf
#   nginx -t && nginx -s reload
#
# Static assets (preview HTML, CSS, fonts, KaTeX) are served straight from the
# repo's assets/ directory through the /opt/homebrew/var/www/pandocmd symlink.
# The /livereload WebSocket is proxied to the persistent pandocmd live-reload
# hub daemon (bin/pandocmd-preview-server.py, started by `ppl`) on 127.0.0.1:35729.
#
# This server is the default host on :80 so it also serves requests made through
# this machine's Tailscale address or hostname.
server {
    listen       80 default_server;
    server_name  127.0.0.1;

    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    root /opt/homebrew/var/www/pandocmd;

    # Live-reload WebSocket -> local hub daemon. Long timeouts keep the idle
    # socket open between edits; buffering off so reloads are delivered at once.
    location /livereload {
        proxy_pass http://127.0.0.1:35729;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # Rebuilt on every save: never cache, always reflect the latest build.
    location /preview/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Fonts and the KaTeX runtime never change mid-edit: cache hard so live
    # reload does not re-fetch them (no fallback-font flash or reflow).
    location /fonts/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }
    location /katex/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }
    location = /favicon.svg {
        gzip_static on;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # Stylesheets and anything else are edited live: revalidate each reload.
    location / {
        add_header Cache-Control "no-cache" always;
    }
}
